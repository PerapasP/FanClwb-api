services:
  api:
    build:
      context: .
      dockerfile: prod.Dockerfile
    container_name: fanclwb-api
    restart: always
    ports:
      - "${PORT:-5599}:5599"
    env_file:
      - .env.prod
    volumes:
      - ./secrets:/app/secrets
      # Uncomment if you want to use local storage for uploads
      # - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5599
    networks:
      - fanclwb-network

  nginx:
    image: nginx:alpine
    container_name: fanclwb-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - fanclwb-network

networks:
  fanclwb-network:
    driver: bridge